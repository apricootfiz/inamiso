<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>YouTube Playlist</title>
  <style>
    body { font-family: sans-serif; }
    #list { margin-bottom: 20px; }
    .item { margin: 5px 0; }
    button { margin-right: 10px; }
  </style>
</head>
<body>

<h2>曲リスト</h2>

<button onclick="playSelected()">再生</button>
<button onclick="prevVideo()">前へ</button>
<button onclick="nextVideo()">次へ</button>

<button onclick="selectAll()">全選択</button>
<button onclick="clearAll()">全解除</button>

<div id="list"></div>

<label><input type="checkbox" id="shuffle"> シャッフル</label>
<label><input type="checkbox" id="loop"> ループ</label>

<hr>

<div id="nowPlaying"></div>
<div id="player"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="assets/js/music.js"></script>

</body>
</html>
