<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Playlist</title>
  <link rel="stylesheet" href="assets/css/music.css">
  <style>
    body { font-family: sans-serif; }
    #list { margin-bottom: 20px; }
    .item { margin: 5px 0; }
    button { margin-right: 10px; }
  </style>
</head>
<body>

<!-- ▼ 固定エリア -->
<div id="app">

  <div id="playerArea">
	  <div id="playerContainer">
	    <div id="nowPlaying"></div>
	    <div id="player"></div>
	  </div>
	  
	  <div class="control-row">
	  
	    <!-- シャッフル -->
	    <button id="shuffleBtn" class="icon-btn" onclick="toggleShuffle()">
	      <svg viewBox="0 0 24 24" class="icon">
	        <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
	      </svg>
	    </button>
	    	  
	    <!-- 前へ -->
	    <button class="icon-btn" onclick="prevVideo()">
	      <svg viewBox="0 0 24 24" class="icon">
	        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
	      </svg>
	    </button>

	    <!-- 再生 -->
	    <button class="icon-btn" onclick="playSelected()">
	      <svg viewBox="0 0 24 24" class="icon">
	        <path d="M8 5v14l11-7z"/>
	      </svg>
	    </button>

	    <!-- 次へ -->
	    <button class="icon-btn" onclick="nextVideo()">
	      <svg viewBox="0 0 24 24" class="icon">
	        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
	      </svg>
	    </button>

	    <!-- ループ -->
	    <button class="icon-btn" onclick="toggleLoop()">
	      <svg viewBox="0 0 24 24" class="icon">
	        <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
	      </svg>
	    </button>

	    <!-- <button onclick="stopVideo()">停止</button> -->
	  </div>
	  
	  <div class="control-row">
	    <button onclick="selectAll()">全選択</button>
	    <button onclick="clearAll()">全解除</button>
	    
	  </div>
	  
  </div>

  <div id="mainArea">
	  <div id="controls">
	  

	  </div>
	  
	  <div id="searchArea">
	    <input type="text" id="searchInput" placeholder="曲名・アーティスト・配信タイトルで検索">
	    <div id="songCount"></div>
	  </div>

	  <div id="listHeader">

	    <div class="header-row">
	      <div class="col-song">曲名</div>
	      <div class="col-artist">アーティスト</div>
	      <div class="col-check">✔</div>
	    </div>

	  </div>

	<!-- ▼ スクロールエリア -->
	<div id="listContainer">
	  <div id="list"></div>
	</div>

  </div>
</div>

<script src="assets/js/music.js" defer></script>
<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
