<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Playlist</title>
  <link rel="stylesheet" href="assets/css/music.css">
  <style>
    body { font-family: sans-serif; }
    #list { margin-bottom: 20px; }
    .item { margin: 5px 0; }
    button { margin-right: 10px; }
  </style>
</head>
<body>

<!-- ▼ 固定エリア -->
<div id="app">

  <div id="playerArea">
	  <div id="playerContainer">
	    <div id="nowPlaying"></div>
	    <div id="player"></div>
	  </div>
	  
	  <div class="control-row">
	    <button onclick="playSelected()">
	      <img src="assets/images/test.png" alt="再生">
	    </button>
	    <button onclick="prevVideo()">前へ</button>
	    <button onclick="nextVideo()">次へ</button>
	    <button onclick="stopVideo()">停止</button>
	  </div>
	  
	  <div class="control-row">
	    <button onclick="selectAll()">全選択</button>
	    <button onclick="clearAll()">全解除</button>
	    <label><input type="checkbox" id="shuffle"> シャッフル</label>
	    <label><input type="checkbox" id="loop"> ループ</label>
	  </div>
	  
  </div>

  <div id="mainArea">
	  <div id="controls">
	  

	  </div>
	  
	  <div id="searchArea">
	    <input type="text" id="searchInput" placeholder="曲名・アーティスト・配信タイトルで検索">
	    <div id="songCount"></div>
	  </div>

	  <div id="listHeader">

	    <div class="header-row">
	      <div class="col-song">曲名</div>
	      <div class="col-artist">アーティスト</div>
	      <div class="col-check">✔</div>
	    </div>

	  </div>

	<!-- ▼ スクロールエリア -->
	<div id="listContainer">
	  <div id="list"></div>
	</div>

  </div>
</div>

<script src="assets/js/music.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
