<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>配信カレンダー</title>
  <style>
    body {
      font-family: sans-serif;
    }
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .day {
      border: 1px solid #ccc;
      padding: 6px;
      font-size: 12px;
      min-height: 140px;
    }
    .day img {
      width: 100%;
      margin-top: 6px;
      cursor: pointer;
    }
    .comments {
      min-height: 2.6em;
      margin-top: 6px;
      font-size: 11px;
      color: #555;
    }
    .comments div {
      line-height: 1.3em;
    }
    .thumbs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      margin-top: 6px;
    }
    .sun { background: #fff5f5; }
    .sat { background: #f5f9ff; }

    @media (max-width: 768px) {
      .calendar {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    
    @media (max-width: 480px) {
      .calendar {
        grid-template-columns: 1fr;
      }
    }

  </style>
</head>
<body>

<h2>2026年1月</h2>
<div class="calendar" id="calendar"></div>

<script>
/* ===============================
   設定
================================ */
const year = 2026;
const month = 0; // 0 = 1月
const weekDays = ["日", "月", "火", "水", "木", "金", "土"];

const sheetUrl =
  "https://docs.google.com/spreadsheets/d/1fnYlyOuVm6bl21crPuUXCmWE6jQuxjeAfl-T0z-PhcA/gviz/tq?tqx=out:csv";

/* ===============================
   YouTube動画ID抽出（完全対応）
================================ */
function extractVideoId(url) {
  if (!url) return null;
  try { url = decodeURIComponent(url); } catch (e) {}

  const patterns = [
    /youtube\.com\/watch\?v=([0-9A-Za-z_-]{11})/,
    /youtube\.com\/live\/([0-9A-Za-z_-]{11})/,
    /youtu\.be\/([0-9A-Za-z_-]{11})/
  ];

  for (const p of patterns) {
    const m = url.match(p);
    if (m) return m[1];
  }
  return null;
}

/* ===============================
   日付正規化
================================ */
function normalizeDate(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr.trim();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

/* ===============================
   CSV取得 & パース
================================ */
fetch(sheetUrl)
  .then(res => res.text())
  .then(csv => {
    const lines = csv.split(/\r?\n/).slice(1);
    const dayMap = {};

    lines.forEach(line => {
      if (!line.trim()) return;

      const cols = line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
      if (!cols || cols.length < 2) return;
      
      const dateRaw  = cols[0].replace(/^"|"$/g, "").trim();
      const valueRaw = cols[1].replace(/^"|"$/g, "").trim();

      const date = normalizeDate(dateRaw);

      if (!dayMap[date]) {
        dayMap[date] = { videos: [], comments: [] };
      }

      // http / https 判定
      if (/^https?:\/\//i.test(valueRaw)) {
        const videoId = extractVideoId(valueRaw);
        if (videoId) {
          dayMap[date].videos.push(videoId);
        } else {
          dayMap[date].comments.push(valueRaw);
        }
      } else {
        dayMap[date].comments.push(valueRaw);
      }
    });

    console.log("dayMap:", dayMap);
    renderCalendar(dayMap);
  });

/* ===============================
   カレンダー描画
================================ */
function renderCalendar(dayMap) {
  const calendar = document.getElementById("calendar");

  for (let day = 1; day <= 31; day++) {
    const dateObj = new Date(year, month, day);
    const weekDay = weekDays[dateObj.getDay()];
    const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;

    const div = document.createElement("div");
    div.className = "day";

    if (weekDay === "日") div.classList.add("sun");
    if (weekDay === "土") div.classList.add("sat");

    div.innerHTML = `<strong>${day}（${weekDay}）</strong>`;

    if (dayMap[dateStr]) {
      const { videos, comments } = dayMap[dateStr];


        const commentBox = document.createElement("div");
        commentBox.className = "comments";
        comments.forEach(text => {
          const p = document.createElement("div");
          p.textContent = "・" + text;
          commentBox.appendChild(p);
        });
        div.appendChild(commentBox);

      if (videos.length) {
        const thumbs = document.createElement("div");
        thumbs.className = "thumbs";

        videos.forEach(videoId => {
          const img = document.createElement("img");
          img.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
          img.onclick = () => {
            window.open(`https://www.youtube.com/watch?v=${videoId}`, "_blank");
          };
          thumbs.appendChild(img);
        });

        div.appendChild(thumbs);
      }      
    }

    calendar.appendChild(div);
  }
}
</script>

</body>
</html>
