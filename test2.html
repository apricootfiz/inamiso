<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>YouTube 区間再生（リストクリックで音あり）</title>
  <style>
    body {
      display: flex;
      font-family: sans-serif;
      padding: 20px;
    }
    #playlist {
      width: 250px;
      margin-right: 20px;
    }
    .item {
      padding: 10px;
      cursor: pointer;
      border-bottom: 1px solid #ccc;
      font-size: 13px;
    }
    .item.active {
      background-color: #007BFF;
      color: white;
      font-weight: bold;
    }
    #player {
      flex: 1;
    }
    #mainTitle {
      font-size: 15px;
      margin-bottom: 10px;
      text-align: center;
    }    
  </style>
</head>
<body>
  <div id="playlistArea">
    <h2 id="mainTitle">SONG</h2>
  </div><br>
  <div id="playlist"></div>
  <div id="player"></div>

  <script>
    const videoSegments = [
      { videoId: 'ZRhe1FZbLGY', start: 1489, end: 1774, title: '空っぽなら、踊ろうぜ / Guiano×理芽' },
      { videoId: '6x_sX1nAV5Q', start: 1527, end: 1858, title: '星のうつわ / スキマスイッチ' },
      { videoId: '6x_sX1nAV5Q', start: 3719, end: 4028, title: 'カブトムシ / aiko' },
    ];

    let player;
    let currentIndex = null; // 初期は未選択
    let checkInterval;

    // ✅ プレイリスト描画
    function renderPlaylist() {
      const playlistEl = document.getElementById('playlist');
      playlistEl.innerHTML = '';
      videoSegments.forEach((segment, index) => {
        const item = document.createElement('div');
        item.className = 'item';
        item.textContent = segment.title;
        item.onclick = () => {
          currentIndex = index;
          loadAndPlayCurrentVideo();
        };
        playlistEl.appendChild(item);
      });
    }

    // ✅ 再生と監視を開始
    function loadAndPlayCurrentVideo() {
      if (currentIndex === null) return;
      const segment = videoSegments[currentIndex];
      if (!segment) return;

      updateActiveItem();

      if (player) {
        player.loadVideoById({
          videoId: segment.videoId,
          startSeconds: segment.start
        });
        player.unMute(); // 🔊 音あり
        player.playVideo();
      }

      clearInterval(checkInterval);
      checkInterval = setInterval(() => {
        const currentTime = player.getCurrentTime();
        if (currentTime >= segment.end) {
          nextVideo();
        }
      }, 500);
    }

    // ✅ 次の動画へ
    function nextVideo() {
      clearInterval(checkInterval);
      currentIndex++;
      if (currentIndex < videoSegments.length) {
        loadAndPlayCurrentVideo();
      } else {
        console.log('全ての再生が完了しました。');
        currentIndex = null;
        updateActiveItem();
      }
    }

    // ✅ 再生中のリストアイテムをハイライト
    function updateActiveItem() {
      const items = document.querySelectorAll('.item');
      items.forEach((item, idx) => {
        item.classList.toggle('active', idx === currentIndex);
      });
    }

    // ✅ プレイヤー状態変化
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        nextVideo();
      }
    }

    // ✅ YouTube API準備完了時
    function onYouTubeIframeAPIReady() {
      renderPlaylist();
      // 最初は何も再生しない。空の初期状態でプレイヤー生成。
      player = new YT.Player('player', {
        height: '360',
        width: '640',
        videoId: '', // 空動画（初期）
        events: {
          onStateChange: onPlayerStateChange
        }
      });
    }
  </script>

  <!-- ✅ YouTube IFrame API 読み込み -->
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
