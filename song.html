<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ▼ アイコン設定 -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <title>Inami</title>
  <link rel="stylesheet" href="assets/css/music.css">
  <style>
    body { font-family: sans-serif; }
    #list { margin-bottom: 20px; }
    .item { margin: 5px 0; }
    button { margin-right: 10px; }
  </style>
</head>
<body>

<!-- ▼ 固定エリア -->
<div id="app">

  <div id="playerArea">
	  <div id="playerContainer">
	    <div id="nowPlaying"></div>
	    <div id="player"></div>
	  </div>
	  
	  <div class="control-row">
	  
	    <!-- お気に入り -->
	    <!-- <button id="shuffleBtn" class="icon-btn" onclick="toggleFavorite()">
	      <svg viewBox="0 -960 960 960" class="icon">
	        <path d="m480-120-58-52q-101-91-167-157T150-447.5Q111-500 95.5-544T80-634q0-94 63-157t157-63q52 0 99 22t81 62q34-40 81-62t99-22q94 0 157 63t63 157q0 46-15.5 90T810-447.5Q771-395 705-329T538-172l-58 52Zm0-108q96-86 158-147.5t98-107q36-45.5 50-81t14-70.5q0-60-40-100t-100-40q-47 0-87 26.5T518-680h-76q-15-41-55-67.5T300-774q-60 0-100 40t-40 100q0 35 14 70.5t50 81q36 45.5 98 107T480-228Zm0-273Z"/>
	      </svg>
	    </button> -->
	    
	    <!-- シャッフル -->
	    <button id="shuffleBtn" class="icon-btn" onclick="toggleShuffle()">
	      <svg viewBox="0 0 24 24" class="icon">
	        <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
	      </svg>
	    </button>
	    	  
	    <!-- 前へ -->
	    <button class="icon-btn" onclick="prevVideo()">
	      <svg viewBox="0 0 24 24" class="icon">
	        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
	      </svg>
	    </button>

	    <button id="playBtn" class="icon-btn" onclick="playSelected()">
	      <!-- 再生 -->
	      <svg viewBox="0 0 24 24" class="icon icon-play">
	        <path d="M8 5v14l11-7z"/>
	      </svg>
	      
	      <!-- 停止 -->
	      <svg viewBox="0 0 24 24" class="icon icon-stop">
	        <path d="M6 6h12v12H6z"/>
	      </svg>
	    </button>

	    <!-- 次へ -->
	    <button class="icon-btn" onclick="nextVideo()">
	      <svg viewBox="0 0 24 24" class="icon">
	        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
	      </svg>
	    </button>

	    <!-- ループ -->
	    <button id="loopBtn" class="icon-btn" onclick="toggleLoop()">
	      <svg viewBox="0 0 24 24" class="icon">
	        <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
	      </svg>
	    </button>
	    
	    <!-- 再生リスト -->
	    <!-- <button id="loopBtn" class="icon-btn" onclick="toggleSelectList()">
	      <svg viewBox="0 -960 960 960" class="icon">
	        <path d="M640-160q-50 0-85-35t-35-85q0-50 35-85t85-35q11 0 21 1.5t19 6.5v-328h200v80H760v360q0 50-35 85t-85 35ZM120-320v-80h320v80H120Zm0-160v-80h480v80H120Zm0-160v-80h480v80H120Z"/>
	      </svg>
	    </button> -->
	    
	  </div>
	  
  </div>

  <div id="mainArea">

	  <div id="searchArea">
	    <input type="text" id="searchInput" placeholder="曲名・アーティスト・配信タイトルで検索">
	    <div id="songCount"></div>
	  </div>

	  <div id="listHeader">

	    <div class="header-row">
	      <div class="col-song">曲名</div>
	      <div class="col-artist">アーティスト</div>
	      
	      <div class="col-check">
	      	<button id="selectToggleBtn" class="icon-btn-check" onclick="toggleSelectAll()">
	      		<svg viewBox="0 0 24 24" class="icon-check">
	        		<path d="M0 0h24v24H0z" fill="none"/><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
	      		</svg>
	      	</button>
	      </div>
	      
	    </div>

	  </div>

	<!-- ▼ スクロールエリア -->
	<div id="listContainer">
	  <div id="list"></div>
	</div>

  </div>
</div>

<script src="assets/js/music.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
