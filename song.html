    let player;
    let currentIndex = null;
    let checkInterval;

    function renderPlaylist() {
      const playlistEl = document.getElementById('playlist');
      playlistEl.innerHTML = '';
    
      let currentGroup = null;
    
      videoSegments.forEach((segment, index) => {
        const item = document.createElement('div');
    
        if (segment.type === 'label') {
          item.textContent = segment.title;
          item.className = 'label';
          item.style.cursor = 'pointer';
    
          // 折りたたみ対象の container を作成
          const groupContainer = document.createElement('div');
          groupContainer.className = 'groupContainer';

          //  初期状態で非表示にする
          groupContainer.classList.add('hidden');
          
          // 折りたたみ状態の管理
          item.onclick = () => {
            groupContainer.classList.toggle('hidden');
          };
    
          playlistEl.appendChild(item);
          playlistEl.appendChild(groupContainer);
          currentGroup = groupContainer;
    
        } else {
          item.className = 'item';
          item.textContent = segment.title;
          item.onclick = () => {
            currentIndex = index;
            loadAndPlayCurrentVideo();
          };
          if (currentGroup) {
            currentGroup.appendChild(item);
          } else {
            playlistEl.appendChild(item); // ラベルがない場合用
          }
        }
      });
    }

    
    function loadAndPlayCurrentVideo() {
      if (currentIndex === null) return;
      const segment = videoSegments[currentIndex];
      if (!segment || segment.type !== 'video') return;

      updateActiveItem();

      if (player) {
        player.loadVideoById({
          videoId: segment.videoId,
          startSeconds: segment.start
        });
        player.unMute();
        player.playVideo();
      }

      clearInterval(checkInterval);
      checkInterval = setInterval(() => {
        const currentTime = player.getCurrentTime();
        if (currentTime >= segment.end) {
          nextVideo();
        }
      }, 500);
    }

    function nextVideo() {
      clearInterval(checkInterval);
      currentIndex++;
      while (currentIndex < videoSegments.length && videoSegments[currentIndex].type !== 'video') {
        currentIndex++;
      }
      if (currentIndex < videoSegments.length) {
        loadAndPlayCurrentVideo();
      } else {
        currentIndex = null;
        updateActiveItem();
      }
    }

    function updateActiveItem() {
      const items = document.querySelectorAll('.item');
      let videoIndex = 0;
      videoSegments.forEach((segment, idx) => {
        if (segment.type === 'video') {
          const item = items[videoIndex];
          item.classList.toggle('active', idx === currentIndex);
          videoIndex++;
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        nextVideo();
      }
    }

    function onYouTubeIframeAPIReady() {
      renderPlaylist();
      player = new YT.Player('player', {
        height: '360',
        width: '100%',
        videoId: '', // 最初は空
        events: {
          onStateChange: onPlayerStateChange
        }
      });
    }
