<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>YouTubeカレンダー</title>
  <style>
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .day {
      border: 1px solid #ccc;
      padding: 4px;
      font-size: 12px;
    }
    img {
      width: 100%;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<h2>2026年1月</h2>
<div class="calendar" id="calendar"></div>

<script>
const sheetUrl = "https://docs.google.com/spreadsheets/d/1fnYlyOuVm6bl21crPuUXCmWE6jQuxjeAfl-T0z-PhcA/gviz/tq?tqx=out:csv";

function extractVideoId(url) {
  const match = url.match(/(?:v=|\/)([0-9A-Za-z_-]{11})/);
  return match ? match[1] : null;
}

fetch(sheetUrl)
  .then(res => res.text())
  .then(csv => {
    const lines = csv.split("\n").slice(1);
    const videoMap = {};

    lines.forEach(line => {
      const [date, url] = line.split(",");
      const id = extractVideoId(url);
      if (id) videoMap[date.trim()] = id;
    });

    renderCalendar(videoMap);
  });

function renderCalendar(videoMap) {
  const calendar = document.getElementById("calendar");

  for (let day = 1; day <= 31; day++) {
    const dateStr = `2026-01-${String(day).padStart(2, "0")}`;
    const div = document.createElement("div");
    div.className = "day";
    div.innerHTML = `<strong>${day}</strong>`;

    if (videoMap[dateStr]) {
      div.innerHTML += `
        <img src="https://img.youtube.com/vi/${videoMap[dateStr]}/hqdefault.jpg">
      `;
    }
    calendar.appendChild(div);
  }
}
</script>

</body>
</html>
