<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ▼ アイコン設定 -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <title>Inami</title>
  <link rel="stylesheet" href="assets/css/music.css">
</head>
<body>

<!-- ▼ 固定エリア -->
<div id="app">

  <div id="playerArea">
	  <div id="playerContainer">
	    <div id="nowPlaying"></div>
	    <div id="player"></div>
	  </div>
	  
	  <div class="control-row">
	  
	    <!-- シャッフル -->
	    <button id="shuffleBtn" class="icon-btn" onclick="toggleShuffle()">
	      <svg viewBox="0 0 24 24" class="icon">
	        <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
	      </svg>
	    </button>
	    	  
	    <!-- 前へ -->
	    <button class="icon-btn" onclick="prevVideo()">
	      <svg viewBox="0 0 24 24" class="icon">
	        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
	      </svg>
	    </button>

	    <button id="playBtn" class="icon-btn" onclick="playSelected()">
	      <!-- 再生 -->
	      <svg viewBox="0 0 24 24" class="icon icon-play">
	        <path d="M8 5v14l11-7z"/>
	      </svg>
	      
	      <!-- 停止 -->
	      <svg viewBox="0 0 24 24" class="icon icon-stop">
	        <path d="M6 6h12v12H6z"/>
	      </svg>
	    </button>

	    <!-- 次へ -->
	    <button class="icon-btn" onclick="nextVideo()">
	      <svg viewBox="0 0 24 24" class="icon">
	        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
	      </svg>
	    </button>

	    <!-- ループ -->
	    <button id="loopBtn" class="icon-btn" onclick="toggleLoop()">
	      <svg viewBox="0 0 24 24" class="icon">
	        <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
	      </svg>
	    </button>
	    
	  </div>
	  
  </div>

  <div id="mainArea">

	  <div id="searchArea">
	    <input type="text" id="searchInput" placeholder="曲名・アーティスト・配信タイトルで検索">
	    <div id="songCount"></div>
	  </div>


		<!-- =========================================
		     ■ 表示切り替えタブ
		========================================= -->
		<div id="viewTabs" class="view-tabs">

		  <button
		    class="view-tab active"
		    type="button"
		    data-view="all">
		    曲一覧
		  </button>

		  <button
		    class="view-tab"
		    type="button"
		    data-view="favorite">
		    お気に入り
		  </button>

		  <button
		    class="view-tab"
		    type="button"
		    data-view="queue">
		    再生リスト
		  </button>

		</div>

	<!-- ▼ スクロールエリア -->
	<div id="listContainer">
	  <div id="list"></div>
	</div>

  </div>
</div>

<!-- =========================================
     ■ 曲一覧モーダル
========================================= -->
<div id="songModal" class="song-modal hidden">

  <!-- 背景クリックで閉じる -->
  <div
    class="song-modal-bg"
    onclick="closeSongModal()">
  </div>

  <!-- モーダル本体 -->
  <div class="song-modal-box">

    <!-- 閉じるボタン -->
    <button
      class="song-modal-close"
      onclick="closeSongModal()">
      ×
    </button>

    <!-- サムネイル -->
    <img
      id="modalThumb"
      class="modal-thumb"
      alt="">

    <!-- 配信タイトル -->
    <div id="modalStreamTitle"
         class="modal-stream-title">
    </div>

    <!-- 配信日 -->
    <div id="modalDate"
         class="modal-date">
    </div>

    <!-- 曲一覧 -->
    <div id="modalSongList"
         class="modal-song-list">
    </div>

  </div>

</div>


<script src="assets/js/music.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
