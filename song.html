<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>YouTubeサムネイルカレンダー</title>
  <style>
    body {
      font-family: sans-serif;
    }
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .day {
      border: 1px solid #ccc;
      padding: 6px;
      font-size: 12px;
      min-height: 120px;
    }
    .day img {
      width: 100%;
      margin-top: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>2026年1月</h2>
<div class="calendar" id="calendar"></div>

<script>
/* ===============================
   設定
================================ */
const sheetUrl =
  "https://docs.google.com/spreadsheets/d/1fnYlyOuVm6bl21crPuUXCmWE6jQuxjeAfl-T0z-PhcA/gviz/tq?tqx=out:csv";

/* ===============================
   YouTube動画ID抽出（ライブ対応）
================================ */
function extractVideoId(url) {
  if (!url) return null;
  const match = url.match(
    /(?:youtube\.com\/(?:watch\?v=|live\/)|youtu\.be\/)([0-9A-Za-z_-]{11})/
  );
  return match ? match[1] : null;
}

/* ===============================
   日付正規化
   2026/1/3 → 2026-01-03
================================ */
function normalizeDate(dateStr) {
  return dateStr
    .trim()
    .replace(/\//g, "-")
    .split("-")
    .map((v, i) => (i === 0 ? v : v.padStart(2, "0")))
    .join("-");
}

/* ===============================
   CSV取得
================================ */
fetch(sheetUrl)
  .then(res => res.text())
  .then(csv => {
    const lines = csv.split(/\r?\n/).slice(1);
    const videoMap = {};

    lines.forEach(line => {
      if (!line) return;
      const [dateRaw, url] = line.split(",");
      const videoId = extractVideoId(url);

      if (!videoId) return;

      const date = normalizeDate(dateRaw);
      videoMap[date] = videoId;
    });

    console.log("videoMap:", videoMap);
    renderCalendar(videoMap);
  });

/* ===============================
   カレンダー描画
================================ */
function renderCalendar(videoMap) {
  const calendar = document.getElementById("calendar");

  for (let day = 1; day <= 31; day++) {
    const dateStr = `2026-01-${String(day).padStart(2, "0")}`;

    const div = document.createElement("div");
    div.className = "day";
    div.innerHTML = `<strong>${day}</strong>`;

    if (videoMap[dateStr]) {
      const videoId = videoMap[dateStr];
      const img = document.createElement("img");
      img.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
      img.onclick = () => {
        window.open(`https://www.youtube.com/watch?v=${videoId}`, "_blank");
      };
      div.appendChild(img);
    }

    calendar.appendChild(div);
  }
}
</script>

</body>
</html>
