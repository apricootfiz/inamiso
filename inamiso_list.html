<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>YouTube 区間連続再生</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
  </style>
</head>
<body>
  <h2>YouTube 区間再生＋自動切り替え</h2>
  <div id="player"></div>

  <script>
    // ✅ 再生リスト（動画ID、開始秒、終了秒）
    const videoSegments = [
      { videoId: 'ZRhe1FZbLGY', start: 1489, end: 1774 },
      { videoId: 'GV9sHBUiKCs?si=CzVyFAYFlpVdwGUU', start: 10, end: 40 },
    ];

    let player;
    let currentIndex = 0;
    let checkInterval;

    // ✅ YouTube API読み込み後に呼ばれる
    function onYouTubeIframeAPIReady() {
      loadCurrentVideo();
    }

    // ✅ 現在の動画を読み込む
    function loadCurrentVideo() {
      const segment = videoSegments[currentIndex];
      if (!segment) return;

      if (player) {
        player.loadVideoById({
          videoId: segment.videoId,
          startSeconds: segment.start,
        });
      } else {
        player = new YT.Player('player', {
          height: '360',
          width: '640',
          videoId: segment.videoId,
          playerVars: {
            autoplay: 1,
            start: segment.start,
            mute: 1,
          },
          events: {
            onReady: onPlayerReady,
            onStateChange: onPlayerStateChange
          }
        });
      }

      // ✅ 区間終了の監視開始
      clearInterval(checkInterval);
      checkInterval = setInterval(() => {
        const currentTime = player.getCurrentTime();
        if (currentTime >= segment.end) {
          nextVideo();
        }
      }, 500);
    }

    // ✅ プレイヤー準備完了時
    function onPlayerReady(event) {
      event.target.playVideo();
    }

    // ✅ 状態変化
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        nextVideo();
      }
    }

    // ✅ 次の動画へ進む
    function nextVideo() {
      clearInterval(checkInterval);
      currentIndex++;
      if (currentIndex < videoSegments.length) {
        loadCurrentVideo();
      } else {
        console.log("全ての動画再生が完了しました。");
      }
    }
  </script>

  <!-- ✅ YouTube IFrame API の読み込み -->
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
