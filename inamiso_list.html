<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ミニプレイヤーでYouTube区間再生</title>
  <style>
    .video-links {
      text-align: center;
      margin-bottom: 20px;
    }
    .video-links a {
      cursor: pointer;
      display: block;
      margin: 5px;
      text-decoration: underline;
      color: blue;
    }

    /* 🎬 ミニプレイヤースタイル */
    #player {
      width: 300px;
      height: 170px;
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      border-radius: 8px;
      display: none; /* 初期非表示 */
    }
  </style>
</head>
<body>

<h2 style="text-align:center;">クリックでミニプレイヤー開始</h2>

<div class="video-links" id="video-links">
  <a href="https://www.youtube.com/watch?v=ZRhe1FZbLGY&start=1489&end=1495">動画1</a>
  <a href="https://www.youtube.com/watch?v=ZRhe1FZbLGY&start=1489&end=1495">動画2</a>
</div>

<iframe id="player" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>

<script>
  const links = document.querySelectorAll('.video-links a');
  const playlist = [];

  links.forEach(link => {
    const url = new URL(link.href);
    const id = url.searchParams.get("v");
    const start = parseInt(url.searchParams.get("start")) || 0;
    const end = parseInt(url.searchParams.get("end")) || 0;
    if (id && end > start) {
      playlist.push({ id, start, end });
    }
  });

  let currentIndex = 0;
  let ytPlayer;
  let intervalId;
  let playerReady = false;
  let hasStarted = false;

  // YouTube API読み込み
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);

  // プレイヤー初期化
  window.onYouTubeIframeAPIReady = function () {
    ytPlayer = new YT.Player('player', {
      height: '170',
      width: '300',
      events: {
        'onReady': function () {
          playerReady = true;
          console.log("プレイヤー準備OK");
        }
      }
    });
  };

  // クリックで再生開始
  document.getElementById('video-links').addEventListener('click', function (e) {
    e.preventDefault();

    if (hasStarted || !playerReady) return;

    hasStarted = true;
    document.getElementById('player').style.display = 'block'; // プレイヤー表示
    playVideo(currentIndex);
  });

  function playVideo(index) {
    const video = playlist[index];
    if (!video) return;

    ytPlayer.loadVideoById({
      videoId: video.id,
      startSeconds: video.start
    });

    clearInterval(intervalId);
    intervalId = setInterval(() => {
      const time = ytPlayer.getCurrentTime();
      if (time >= video.end) {
        clearInterval(intervalId);
        nextVideo();
      }
    }, 300);
  }

  function nextVideo() {
    currentIndex++;
    if (currentIndex < playlist.length) {
      playVideo(currentIndex);
    } else {
      console.log("🎉 全ての動画の再生が完了しました");
      // プレイヤーを非表示にするならここで：
      // document.getElementById('player').style.display = 'none';
    }
  }
</script>

</body>
</html>
