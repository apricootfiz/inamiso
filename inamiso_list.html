
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>YouTube 区間再生リンク順プレイヤー</title>
  <style>
    iframe {
      width: 560px;
      height: 315px;
      display: block;
      margin: 20px auto;
    }
    .video-links {
      text-align: center;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

<h2 style="text-align:center;">YouTubeリンク順 区間再生</h2>

<div class="video-links">
  <!-- 再生したいYouTubeリンク（start=秒, end=秒を必ずURLに付ける） -->
  <a href="https://www.youtube.com/watch?v=ZRhe1FZbLGY&start=1489&end=1774">動画1</a><br>
  <a href="https://www.youtube.com/watch?v=ZRhe1FZbLGY&start=1489&end=1774">動画2</a><br>
</div>

<iframe id="player" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>

<script>
  const links = document.querySelectorAll('.video-links a');
  const playlist = [];

  links.forEach(link => {
    const url = new URL(link.href);
    const id = url.searchParams.get("v");
    const start = parseInt(url.searchParams.get("start")) || 0;
    const end = parseInt(url.searchParams.get("end")) || 0;
    if (id && end > start) {
      playlist.push({ id, start, end });
    }
  });

  let currentIndex = 0;
  let ytPlayer;
  let intervalId;

  // YouTube API 読み込み
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);

  // API準備完了
  window.onYouTubeIframeAPIReady = function () {
    ytPlayer = new YT.Player('player', {
      height: '315',
      width: '560',
      events: {
        'onReady': () => playVideo(currentIndex)
      }
    });
  };

  function playVideo(index) {
    const video = playlist[index];
    if (!video) return;

    ytPlayer.loadVideoById({
      videoId: video.id,
      startSeconds: video.start
    });

    // 区間を監視
    clearInterval(intervalId);
    intervalId = setInterval(() => {
      const time = ytPlayer.getCurrentTime();
      if (time >= video.end) {
        clearInterval(intervalId);
        nextVideo();
      }
    }, 300); // 0.3秒ごとにチェック
  }

  function nextVideo() {
    currentIndex++;
    if (currentIndex < playlist.length) {
      playVideo(currentIndex);
    } else {
      console.log("再生完了！");
    }
  }
</script>

</body>
</html>
