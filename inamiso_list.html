<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>YouTube 区間再生クリック開始</title>
  <style>
    iframe {
      width: 560px;
      height: 315px;
      display: block;
      margin: 20px auto;
    }
    .video-links {
      text-align: center;
      margin-bottom: 20px;
    }
    .video-links a {
      cursor: pointer;
      display: block;
      margin: 5px;
    }
  </style>
</head>
<body>

<h2 style="text-align:center;">リンククリックで開始 - 区間再生</h2>

<div class="video-links" id="video-links">
  <a href="https://www.youtube.com/watch?v=ZRhe1FZbLGY&start=1489&end=1495">動画1</a>
  <a href="https://www.youtube.com/watch?v=ZRhe1FZbLGY&start=1489&end=1495">動画2</a>
</div>

<iframe id="player" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>

<script>
  const links = document.querySelectorAll('.video-links a');
  const playlist = [];

  links.forEach(link => {
    const url = new URL(link.href);
    const id = url.searchParams.get("v");
    const start = parseInt(url.searchParams.get("start")) || 0;
    const end = parseInt(url.searchParams.get("end")) || 0;
    if (id && end > start) {
      playlist.push({ id, start, end });
    }
  });

  let currentIndex = 0;
  let ytPlayer;
  let intervalId;
  let hasStarted = false;

  // YouTube API 読み込み
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);

  // プレイヤー準備
  window.onYouTubeIframeAPIReady = function () {
    ytPlayer = new YT.Player('player', {
      height: '315',
      width: '560',
      events: {}
    });
  };

  // 1本目クリックで再生開始
  document.getElementById('video-links').addEventListener('click', function (e) {
    e.preventDefault();

    if (hasStarted) return;

    hasStarted = true;
    currentIndex = 0;
    playVideo(currentIndex);
  });

  function playVideo(index) {
    const video = playlist[index];
    if (!video) return;

    ytPlayer.loadVideoById({
      videoId: video.id,
      startSeconds: video.start
    });

    clearInterval(intervalId);
    intervalId = setInterval(() => {
      const time = ytPlayer.getCurrentTime();
      if (time >= video.end) {
        clearInterval(intervalId);
        nextVideo();
      }
    }, 300);
  }

  function nextVideo() {
    currentIndex++;
    if (currentIndex < playlist.length) {
      playVideo(currentIndex);
    } else {
      console.log("すべての動画を再生しました");
    }
  }
</script>

</body>
</html>
