<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>YouTube 区間再生（音あり）</title>
  <style>
    body {
      display: flex;
      font-family: sans-serif;
      padding: 20px;
    }
    #playlist {
      width: 250px;
      margin-right: 20px;
    }
    .item {
      padding: 10px;
      cursor: pointer;
      border-bottom: 1px solid #ccc;
    }
    .item.active {
      background-color: #007BFF;
      color: white;
      font-weight: bold;
    }
    #player {
      flex: 1;
    }
    #controls {
      margin-top: 10px;
    }
    button {
      padding: 8px 16px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="playlist"></div>
  <div>
    <div id="player"></div>
    <div id="controls">
      <button id="playButton">▶ 音あり再生開始</button>
    </div>
  </div>

  <script>
    const videoSegments = [
      { videoId: 'ZRhe1FZbLGY', start: 1489, end: 1774, title: '空っぽなら、歌おうぜ' },
      { videoId: '6x_sX1nAV5Q', start: 1527, end: 1858, title: '星のうつわ' },
      { videoId: '6x_sX1nAV5Q', start: 3719, end: 4028, title: 'カブトムシ / aiko' },
    ];

    let player;
    let currentIndex = 0;
    let checkInterval;

    function renderPlaylist() {
      const playlistEl = document.getElementById('playlist');
      playlistEl.innerHTML = '';
      videoSegments.forEach((segment, index) => {
        const item = document.createElement('div');
        item.className = 'item' + (index === currentIndex ? ' active' : '');
        item.textContent = segment.title;
        item.onclick = () => {
          currentIndex = index;
          loadCurrentVideo(false); // 自動再生しない
        };
        playlistEl.appendChild(item);
      });
    }

    function loadCurrentVideo(autoplay = false) {
      const segment = videoSegments[currentIndex];
      if (!segment) return;

      updateActiveItem();

      if (player) {
        player.cueVideoById({
          videoId: segment.videoId,
          startSeconds: segment.start
        });
      } else {
        player = new YT.Player('player', {
          height: '360',
          width: '640',
          videoId: segment.videoId,
          playerVars: {
            start: segment.start
          },
          events: {
            onReady: () => {
              if (autoplay) {
                player.unMute(); // 🔊 音あり
                player.playVideo();
              }
            },
            onStateChange: onPlayerStateChange
          }
        });
      }

      clearInterval(checkInterval);
    }

    function startPlayback() {
      const segment = videoSegments[currentIndex];
      if (!segment || !player) return;

      player.seekTo(segment.start, true);
      player.unMute(); // 🔊 音あり再生
      player.playVideo();

      clearInterval(checkInterval);
      checkInterval = setInterval(() => {
        const currentTime = player.getCurrentTime();
        if (currentTime >= segment.end) {
          nextVideo();
        }
      }, 500);
    }

    function nextVideo() {
      clearInterval(checkInterval);
      currentIndex++;
      if (currentIndex < videoSegments.length) {
        loadCurrentVideo(true); // 自動再生で次へ
        setTimeout(() => {
          player.unMute(); // 🔊 音あり
          player.playVideo();
        }, 500);
      } else {
        console.log('全ての再生が完了しました。');
      }
    }

    function updateActiveItem() {
      const items = document.querySelectorAll('.item');
      items.forEach((item, idx) => {
        item.classList.toggle('active', idx === currentIndex);
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        nextVideo();
      }
    }

    function onYouTubeIframeAPIReady() {
      renderPlaylist();
      loadCurrentVideo(false);
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('playButton').addEventListener('click', startPlayback);
    });
  </script>

  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
